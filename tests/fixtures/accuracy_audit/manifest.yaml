version: 1

cases:
  provenance_broken:
    path: provenance_broken_project
  provenance_valid:
    path: provenance_valid_project
  invalid_encoding:
    path: invalid_encoding_project
    byte_files:
      train.jsonl: "ff"
  contaminated:
    path: ../contaminated_project
  trust_chain:
    path: ../trust_chain_project
  identity_rag:
    path: identity_rag_project
  rag_duplicate:
    path: rag_duplicate_project
  partial_id:
    path: partial_id_project
  heuristic:
    path: heuristic_project
  near_duplicate:
    path: near_duplicate_project
  clean:
    path: clean_project
  formats:
    path: format_project
  schema_contract:
    path: schema_contract_project
  chunk_collision:
    path: chunk_collision_project
  chunk_identity_clean:
    path: chunk_identity_clean_project
  generation_unseeded:
    path: generation_unseeded_project
  generation_seeded:
    path: generation_seeded_project

rules:
  provenance.required_metadata_missing:
    confidence: confirmed
    positive: provenance_broken
    negative: provenance_valid
    abstention: clean
  provenance.manifest_fingerprint_mismatch:
    confidence: confirmed
    positive: provenance_broken
    negative: provenance_valid
    abstention: clean
  provenance.local_source_unresolved:
    confidence: confirmed
    positive: provenance_broken
    negative: provenance_valid
    abstention: clean
  dataset.invalid_text_encoding:
    confidence: confirmed
    positive: invalid_encoding
    negative: clean
    abstention: generation_seeded
  reproducibility.nondeterministic_generation_without_seed:
    confidence: likely
    positive: generation_unseeded
    negative: generation_seeded
    abstention: clean
  contamination.train_eval_overlap:
    confidence: confirmed
    positive: contaminated
    negative: clean
    abstention: clean
  contamination.train_eval_near_duplicate:
    confidence: likely
    positive: contaminated
    negative: clean
  contamination.duplicate_eval_sample:
    confidence: confirmed
    positive: contaminated
    negative: clean
    abstention: clean
  contamination.duplicate_eval_near_duplicate:
    confidence: likely
    positive: near_duplicate
    negative: clean
  contamination.duplicate_train_sample:
    confidence: confirmed
    positive: contaminated
    negative: clean
    abstention: clean
  contamination.duplicate_train_near_duplicate:
    confidence: likely
    positive: near_duplicate
    negative: clean
  contamination.rag_answer_leakage:
    confidence: likely
    positive: contaminated
    negative: clean
  contamination.missing_repro_metadata:
    confidence: confirmed
    positive: contaminated
    negative: clean
    abstention: clean
  contamination.fingerprint_mismatch:
    confidence: confirmed
    positive: contaminated
    negative: clean
    abstention: clean
  evaluation.sample_alignment_mismatch:
    confidence: confirmed
    positive: trust_chain
    negative: clean
    abstention: clean
  dataset.label_inconsistency:
    confidence: confirmed
    positive: trust_chain
    negative: clean
    abstention: clean
  evaluation.metric_out_of_bounds:
    confidence: confirmed
    positive: trust_chain
    negative: clean
    abstention: clean
  rag.unreachable_context_id:
    confidence: confirmed
    positive: identity_rag
    negative: clean
    abstention: clean
  contamination.untrusted_context_interpolation:
    confidence: heuristic
    positive: heuristic
    negative: clean
  contamination.sensitive_value_exposure:
    confidence: heuristic
    positive: contaminated
    negative: clean
  prompt.unresolved_placeholder:
    confidence: heuristic
    positive: heuristic
    negative: clean
  dataset.sample_id_collision:
    confidence: confirmed
    positive: identity_rag
    negative: clean
    abstention: clean
  dataset.empty_evaluation_input:
    confidence: confirmed
    positive: identity_rag
    negative: clean
    abstention: clean
  dataset.partial_sample_id_coverage:
    confidence: confirmed
    positive: partial_id
    negative: clean
    abstention: clean
  dataset.schema_contract_violation:
    confidence: confirmed
    positive: schema_contract
    negative: clean
    abstention: clean
  rag.duplicate_chunk_in_corpus:
    confidence: confirmed
    positive: rag_duplicate
    negative: clean
  rag.chunk_id_collision:
    confidence: confirmed
    positive: chunk_collision
    negative: chunk_identity_clean
    abstention: clean
  rag.empty_or_corrupted_document:
    confidence: confirmed
    positive: identity_rag
    negative: clean
    abstention: clean
  rag.empty_referenced_document:
    confidence: confirmed
    positive: identity_rag
    negative: clean
    abstention: clean
